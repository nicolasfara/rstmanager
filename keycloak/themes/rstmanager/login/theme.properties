# RST Manager login theme: Keycloak's default login (keycloak.v2, PatternFly 5)
# restyled to match the SPA (Tailwind slate palette, white card, slate-900
# primary). Only CSS and messages are overridden, no FreeMarker template, so
# Keycloak upgrades keep working without re-syncing copied templates.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the parent's stylesheet (resolved through the parent chain);
# ours is loaded after it so its rules win.
styles=css/styles.css css/rstmanager.css

# The SPA has no dark mode: keep the login light as well.
darkMode=false

locales=it,en
